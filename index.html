g:35px;box-shadow:var(--shadow)}.final-top{text-align:center;border-bottom:1px solid #446579;padding-bottom:18px}.final-top h1{font-size:clamp(2rem,5vw,3.2rem);margin:8px 0;letter-spacing:-.045em}.nameplate{text-align:center;margin:24px 0 17px}.nameplate .student-name{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:950;word-break:break-word;letter-spacing:-.04em}.final-stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}.final-stat{border:1px solid #3d6073;background:#0d2337;border-radius:13px;text-align:center;padding:17px 10px}.final-stat strong{font-size:clamp(1.5rem,4vw,2.35rem);display:block;color:var(--aqua);line-height:1.2}.final-stat span{font-size:.78rem;color:#c0d4e0}.rank{text-align:center;margin:21px 0;font-weight:850;color:var(--amber)}.instruction{border:2px solid #ffca7e;background:#362d30;border-radius:17px;padding:21px 22px;margin-top:24px}.instruction h2{font-size:1.18rem;color:#ffe1ab;margin:0 0 8px}.instruction p{margin:0 0 10px;color:#fff3e5}.email{display:inline-block;color:#ffffff;font-weight:950;font-size:clamp(.96rem,3vw,1.26rem);overflow-wrap:anywhere;letter-spacing:.01em}.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}.completion-date{color:#b4c7d8;text-align:center;font-size:.8rem;margin-top:16px}.author-foot{color:#a5b7c8;font-size:.82rem;text-align:center;margin-top:28px}.toast{position:fixed;bottom:18px;right:18px;max-width:330px;background:#163d3c;border:1px solid #67d8bf;padding:11px 17px;border-radius:11px;z-index:20;box-shadow:var(--shadow)}.mobile-scroll-hint{display:none;font-size:.72rem;color:var(--muted);margin:7px 0 0}.screenshot-mode .topbar,.screenshot-mode .author-foot,.screenshot-mode .completion-date{display:none}.screenshot-mode .final-wrap{margin:7px auto}.screenshot-mode .final-card{padding:16px}.screenshot-mode .final-top{padding-bottom:7px}.screenshot-mode .final-top h1{font-size:1.7rem;margin:4px 0}.screenshot-mode .final-top>div:last-child{font-size:.72rem}.scr <script>
'use strict';
const TOTAL=30, MAX_SCORE=TOTAL*100, STORAGE_KEY='reset_hr_kozova_v1';
const EMAIL='kristina.opatova@tnuni.sk';
const modules=[
 {name:'Základy manažmentu',short:'Základy',icon:'🧭',fragment:'R',subtitle:'Kto tu vlastne riadi chaos?',intro:'HR centrála nepozná kompetencie. Zisti, čo manažéri robia, komu sa zodpovedajú a ako držia tím pokope.'},
 {name:'Koncepcie manažmentu',short:'Koncepcie',icon:'🧠',fragment:'E',subtitle:'Staré školy, nové problémy',intro:'Virtuálny archív ponúka riešenia od klasikov až po situačný prístup. Vyber vhodný nástroj, nie iba známe meno.'},
 {name:'Rozhodovanie',short:'Rozhodovanie',icon:'⚖️',fragment:'S',subtitle:'Rozhodnutia bez veštenia',intro:'Záplava správ, poloprávd a tlaku. Oddeľ fakty od domnienok a navrhni rozumný postup.'},
 {name:'Plánovanie',short:'Plánovanie',icon:'🗓️',fragment:'E',subtitle:'Deadline sa nezmení sám',intro:'Do nástupu zostáva minimum času. Poskladaj ciele, kroky, zodpovednosti aj plán B.'},
 {name:'Komunikácia',short:'Komunikácia',icon:'💬',fragment:'T',subtitle:'Prečítané ≠ pochopené',intro:'Posledný modul padá na nejasných správach. Nastav komunikáciu, ktorá situáciu vyrieši a nikoho nezosmiešni.'}
];
const questions=[
// 01 — ZÁKLADY
{id:'m01',type:'classify',tag:'Incident • triedenie',title:'Štyri manažérske funkcie pod paľbou',story:'Orbit People zajtra víta nových kolegov. V schránke pristálo päť úloh od vedenia. Manažérka potrebuje vedieť, o akú funkciu manažmentu ide, inak sa nič nepohne.',prompt:'Ku každej situácii priraď PREVAŽUJÚCU manažérsku funkciu.',choices:['Plánovanie','Organizovanie','Vedenie ľudí','Kontrola'],items:[['Určiť cieľ adaptačného dňa a časový harmonogram.','Plánovanie'],['Rozdeliť úlohy a právomoci medzi HR, IT a vedúcich tímov.','Organizovanie'],['Motivovať kolegu, ktorý sa bojí viesť úvodnú prezentáciu.','Vedenie ľudí'],['Porovnať skutočný počet vybavených prístupov s plánom.','Kontrola'],['Stanoviť, čo treba stihnúť do pondelkového rána.','Plánovanie']],why:'Plánovanie určuje ciele a postupy, organizovanie rozdeľuje prácu, vedenie ovplyvňuje ľudí a kontrola porovnáva skutočný stav s požadovaným.',hints:['Pýtaj sa: stanovujem cieľ, rozdeľujem prácu, pôsobím na ľudí, alebo overujem výsledok?','Posledná veta je o tom, čo treba dosiahnuť v budúcnosti.']},
{id:'m02',type:'single',tag:'Voľba • manažérsky mindset',title:'Kto je tu manažér?',story:'V tíme koluje názor: „Manažér je ten, kto všetkým len hovorí, čo majú robiť.“ Tvojou úlohou je opraviť tento mýtus ešte pred prvou poradou.',prompt:'Ktoré vyjadrenie najlepšie vystihuje manažment?',options:['Manažment je hlavne kontrolovať ľudí a hľadať vinníka pri chybe.','Manažment je dosahovanie cieľov prostredníctvom koordinácie zdrojov, procesov a ľudí.','Manažment je len vlastnosť ľudí, ktorí majú vysoké pracovné postavenie.','Manažment znamená robiť všetky dôležité úlohy osobne.'],answer:1,why:'Manažment predstavuje proces smerovania ľudí a ďalších zdrojov k cieľom organizácie. Nestačí len kontrolovať či mať funkciu v názve pozície.',hints:['Manažér nemusí každú úlohu sám vykonať.','Hľadaj spojenie cieľov, koordinácie a zdrojov.']},
{id:'m03',type:'match',tag:'Párovačka • pojmy',title:'Výkon tímu ≠ iba rýchlosť',story:'Šéf napísal: „Spravili sme to rýchlo, takže projekt bol úspešný.“ Problém? Onboarding síce trval krátko, ale noví kolegovia stále nemali prístupy. Diagnostikuj pojmy.',prompt:'Priraď opis k správnemu manažérskemu pojmu.',choices:['Účelnosť – dosahovanie správnych cieľov','Hospodárnosť – primerané využitie zdrojov','Produktivita – pomer výstupov k vstupom','Cieľ – požadovaný budúci stav'],items:[['Zamestnanci dostali všetky prístupy a informácie, ktoré potrebovali.','Účelnosť – dosahovanie správnych cieľov'],['Onboarding prebehol bez zbytočnej duplicity práce a nákladov.','Hospodárnosť – primerané využitie zdrojov'],['Tím vybavil viac požiadaviek za rovnaký pracovný čas.','Produktivita – pomer výstupov k vstupom'],['„Každý nováčik bude mať prístup do systému pred nástupom.“','Cieľ – požadovaný budúci stav']],why:'Účelnosť (effectiveness) znamená dosiahnutie cieľa, hospodárnosť/efektívnosť využitie zdrojov bez plytvania a produktivita vyjadruje vzťah medzi výstupom a vstupom.',hints:['Rýchlosť nemusí znamenať dosiahnutie správneho výsledku.','Veta v úvodzovkách hovorí o stave, ktorý chceme dosiahnuť.']},
{id:'m04',type:'multi',tag:'Audit • vyber 3',title:'Čo rieši manažér, keď všetko horí?',story:'Je piatok 14:00. Dvaja členovia HR tímu robia rovnakú úlohu, jeden nováčik nemá zmluvu a ostatní netušia, čo je priorita. Vedenie žiada „lepší manažment“.',prompt:'Vyber PRESNE TRI konštruktívne zásahy manažéra.',options:['Spresniť priority, výstupy a termíny.','Verejne zosmiešniť človeka, ktorý nestíha.','Rozdeliť zodpovednosti tak, aby sa úlohy neduplikovali.','Zakázať ľuďom klásť otázky.','Zistiť prekážky a priebežne vyhodnocovať postup.','Prevziať všetky úlohy na seba bez vysvetlenia.'],answers:[0,2,4],why:'Manažér nastavuje priority, koordinuje činnosti a kontroluje postup. Strach, mlčanie ani preťaženie jedného človeka nie sú systémové riešenia.',hints:['Dobrý zásah má pomôcť tímu fungovať aj zajtra.','Hľadaj priority, jasné kompetencie a spätné overenie.']},
{id:'m05',type:'order',tag:'Logika • poskladaj postup',title:'Od chaosu k fungujúcemu procesu',story:'Pripravujete nový postup spracovania požiadaviek. Karty s krokmi sú premiešané. Niektoré na seba logicky nadväzujú; musíš zostaviť použiteľný tok práce.',prompt:'Pomocou šípok usporiadaj kroky do najlogickejšieho poradia.',items:[['d','Priebežne zistiť, či postup prináša očakávaný výsledok.'],['b','Určiť, kto za ktorý krok zodpovedá.'],['e','Na základe zistení upraviť postup.'],['a','Stanoviť cieľ a spôsob spracovania požiadaviek.'],['c','Vysvetliť postup tímu a podporiť jeho realizáciu.']],answer:['a','b','c','d','e'],why:'Najskôr stanovujeme cieľ a plán, potom organizujeme prácu, vedieme realizáciu, kontrolujeme výsledok a na základe zistení proces zlepšujeme.',hints:['Čo musí existovať skôr, než rozdelíš zodpovednosti?','Úprava postupu patrí až po zhodnotení výsledkov.']},
{id:'m06',type:'classify',tag:'Zodpovednosť • úrovne riadenia',title:'Kto má rozhodnúť?',story:'Do spoločnosti prichádza nová HR špecialistka. Potrebuješ rozlíšiť úlohy vrcholového, stredného a operatívneho manažmentu. V praxi sa hranice môžu prelínať; tu vyber typickú úroveň.',prompt:'Priraď každé rozhodnutie k NAJTYPOVEJŠEJ úrovni riadenia.',choices:['Vrcholový manažment','Stredný manažment','Operatívny / líniový manažment'],items:[['Schváliť dlhodobú stratégiu rastu celej spoločnosti.','Vrcholový manažment'],['Pretaviť firemnú stratégiu do ročného plánu HR oddelenia.','Stredný manažment'],['Rozdeliť dnešné úlohy medzi členov náborového tímu.','Operatívny / líniový manažment'],['Rozhodnúť o zásadnej expanzii na nový trh.','Vrcholový manažment'],['Koordinovať spoluprácu HR s ďalšími oddeleniami pri plnení ročného plánu.','Stredný manažment']],why:'Vrcholová úroveň určuje celofiremné smerovanie, stredná ho rozpracúva do útvarových plánov a operatívna rieši každodenné vedenie a výkon.',hints:['Všímaj si rozsah a časový horizont rozhodnutia.','Celá firma = vrchol; oddelenie = stred; dnešná práca tímu = operatíva.']},
// 02 — KONCEPCIE
{id:'m07',type:'match',tag:'Archív • autori',title:'Klasici, čo stále ovplyvňujú prax',story:'AI asistent našiel starý manažérsky archív. Mená sa zachovali, ale pri princípoch je chyba. Tvoje prvé prepojenie odomkne ďalší priečinok.',prompt:'Priraď autora k myšlienke, s ktorou sa najviac spája.',choices:['Frederick W. Taylor','Henri Fayol','Max Weber','Elton Mayo'],items:[['Vedecké skúmanie a štandardizovanie pracovných postupov.','Frederick W. Taylor'],['Manažérske funkcie a všeobecné zásady riadenia organizácie.','Henri Fayol'],['Formálne pravidlá, hierarchia a neosobné kompetencie.','Max Weber'],['Význam sociálnych vzťahov a pozornosti venovanej pracovníkom.','Elton Mayo']],why:'Taylor zdôrazňoval vedecké riadenie práce, Fayol administratívny prístup, Weber byrokratický model a Mayo ľudské vzťahy.',hints:['Taylor = metódy práce, Weber = pravidlá a hierarchia.','Fayol = funkcie manažéra, Mayo = sociálne vzťahy.']},
{id:'m08',type:'classify',tag:'Diagnostika • školy',title:'Akú optiku používa manažér?',story:'Na jednej porade padlo šesť návrhov. Každý z nich vychádza z iného pohľadu na riadenie. Rozpoznaj dominantný prístup.',prompt:'Priraď výroky k manažérskej koncepcii.',choices:['Vedecké riadenie (Taylor)','Administratívny prístup (Fayol)','Byrokratický model (Weber)','Ľudské vzťahy (Mayo)','Situačný prístup'],items:[['„Zmerajme pracovné postupy a nájdime štandard, ktorý šetrí pohyby.“','Vedecké riadenie (Taylor)'],['„Potrebujeme jasne určiť funkcie a zásady riadenia.“','Administratívny prístup (Fayol)'],['„Rozhodnutia musia ísť cez známe pravidlá a kompetencie.“','Byrokratický model (Weber)'],['„Skúsme pochopiť, ako vzťahy v tíme vplývajú na motiváciu.“','Ľudské vzťahy (Mayo)'],['„Iný štýl zvolíme pri kríze, iný pri skúsenom autonómnom tíme.“','Situačný prístup']],why:'Koncepcie sa líšia tým, na čo upriamujú pozornosť: pracovný postup, funkcie riadenia, pravidlá, sociálne potreby alebo kontext.',hints:['Identifikuj kľúčové slovo každého výroku: meranie, funkcie, pravidlá, vzťahy, situácia.','Posledná možnosť nestanovuje jeden univerzálny štýl.']},
{id:'m09',type:'single',tag:'Prípad • ľudia vs. proces',title:'Produktivita rastie, nálada padá',story:'HR tím zaviedol detailné normy a meranie každého kliknutia. Po mesiaci vybavuje požiadavky rýchlejšie, no ľudia hlásia stres a strácajú iniciatívu. Čas na rozhodnutie.',prompt:'Ktoré riešenie najlepšie kombinuje poznatky rôznych manažérskych škôl?',options:['Zrušiť každé pravidlo, pretože všetky pravidlá škodia.','Udržať užitočné štandardy, zapojiť tím do ich úprav a sledovať aj pracovnú spokojnosť.','Merať ešte viac a ignorovať spätnú väzbu.','Oznámiť, že motivácia sa organizácie netýka.'],answer:1,why:'Štandardizácia môže pomáhať výkonu, no ľudské potreby, spoluúčasť a spätná väzba sú tiež relevantné. V praxi sa prístupy vhodne kombinujú.',hints:['Nemusíš si vyberať medzi výkonom a ľuďmi za každých okolností.','Najlepšie riešenie spojí užitočné procesy s participáciou zamestnancov.']},
{id:'m10',type:'multi',tag:'Kritické myslenie • vyber 3',title:'Byrokracia: nepriateľ alebo ochrana?',story:'Vo firme vznikajú chyby pri schvaľovaní osobných údajov. Niekto žiada úplne odstrániť pravidlá, iný chce podpis na každý drobný krok. Obe krajnosti sú problém.',prompt:'Vyber PRESNE TRI rozumné tvrdenia o formálnych pravidlách.',options:['Jasné kompetencie môžu znížiť chaos v zodpovednosti.','Čím viac formulárov, tým automaticky lepší manažment.','Pravidlá môžu podporiť predvídateľnosť a rovnaký prístup.','Každá situácia sa vyrieši identickým postupom bez výnimky.','Prehnaná formalizácia môže spomaliť prácu a znížiť flexibilitu.','Najlepší systém nikdy nepotrebuje zodpovednú osobu.'],answers:[0,2,4],why:'Weberov model zdôrazňuje pravidlá, kompetencie a predvídateľnosť. Prílišná rigidita však môže brzdiť rýchlosť aj flexibilitu.',hints:['Hľadaj dva potenciálne prínosy a jedno reálne riziko.','Slová „automaticky“, „každá“ a „nikdy“ sú varovný signál.']},
{id:'m11',type:'single',tag:'Krízový režim • adaptácia',title:'Jeden štýl pre všetkých?',story:'Nový HR tím potrebuje jasný postup, skúsený HR tím by vedel samostatne navrhnúť riešenie. Kolega tvrdí, že dobrý manažér musí viesť každého rovnako.',prompt:'Čo odporúča situačný prístup k riadeniu?',options:['Správny je vždy autoritatívny štýl.','Manažér má prispôsobiť postup charakteru úlohy, ľuďom a okolnostiam.','Manažér nemá nikdy stanovovať pravidlá.','Najlepšie je prevziať štýl najstaršieho kolegu bez ohľadu na kontext.'],answer:1,why:'Situačný prístup odmieta predstavu jedného univerzálneho spôsobu vedenia. Vhodný štýl závisí od kontextu, kompetencií tímu a povahy problému.',hints:['Dva tímy majú rôzne potreby.','Situačný = citlivý na konkrétnu situáciu.']},
{id:'m12',type:'match',tag:'Workshop • vhodný nástroj',title:'Nemiešaj školu s riešením',story:'Máš štyri samostatné problémy a štyri užitočné prístupy. Zvoľ nástroj, ktorý podľa opisu rieši HLAVNÝ problém. Nejde o to, že ostatné prístupy sú úplne nesprávne.',prompt:'Vyber najvhodnejšie manažérske východisko.',choices:['Štandardizácia pracovného postupu','Ujasnenie pravidiel a právomocí','Posilnenie tímových vzťahov','Prispôsobenie štýlu okolnostiam'],items:[['Každý pracovník rieši rovnaký typ formulára inak a vznikajú zbytočné chyby.','Štandardizácia pracovného postupu'],['Nikto nevie, kto smie schváliť výnimku pri spracovaní dokumentov.','Ujasnenie pravidiel a právomocí'],['Tím má napäté vzťahy a prestal otvorene hovoriť o problémoch.','Posilnenie tímových vzťahov'],['Krízový zásah sa rieši rovnako ako pokojná tvorivá porada.','Prispôsobenie štýlu okolnostiam']],why:'Manažérske školy fungujú ako rôzne optiky. Výber nástroja má vychádzať z diagnostiky konkrétneho problému, nie z módneho názvu.',hints:['Rozhoduj podľa primárneho problému v každej situácii.','Chaos pri schvaľovaní súvisí s kompetenciami, napätie v tíme so vzťahmi.']},
// 03 — ROZHODOVANIE
{id:'m13',type:'classify',tag:'Forenzná analýza • informácie',title:'Čo vieme a čo iba tipujeme?',story:'Vedenie chce rozhodnúť, či zmeniť onboarding. V skupinovom chate sa miešajú overené údaje, názory a domnienky. Bez rozlíšenia vznikne zlý verdikt.',prompt:'Roztrieď správy podľa ich charakteru v danom kontexte.',choices:['Overený fakt','Predpoklad / domnienka','Hodnotiaci názor','Otázka na doplnenie údajov'],items:[['Podľa záznamov helpdesku 12 ľudí nedostalo prístup včas.','Overený fakt'],['Určite je to preto, že IT oddelenie je lenivé.','Predpoklad / domnienka'],['Tento onboarding je podľa mňa úplná katastrofa.','Hodnotiaci názor'],['Koľko požiadaviek bolo podaných bez potrebných údajov?','Otázka na doplnenie údajov'],['V reportingu je uvedených 8 nevyriešených tiketov po termíne.','Overený fakt']],why:'Overený fakt má identifikovateľný zdroj, domnienka nie je doložená, hodnotiaci názor vyjadruje postoj a otázka signalizuje chýbajúcu informáciu.',hints:['Rozlišuj merateľný záznam od výkladu príčiny.','„Podľa mňa“ často signalizuje názor; otáznik zasa chýbajúcu informáciu.']},
{id:'m14',type:'order',tag:'Proces • krok za krokom',title:'Rozhodnutie bez preskakovania',story:'Pri nesprávnom onboardingu padlo päť „rýchlych riešení“, no nikto ešte ani nepomenoval problém. Vráť rozhodovanie do zmysluplného poradia.',prompt:'Usporiadaj fázy racionálneho manažérskeho rozhodovania.',items:[['d','Zhodnotiť alternatívy podľa kritérií a rizík.'],['b','Zhromaždiť a overiť relevantné informácie.'],['f','Overiť výsledok a prípadne urobiť korekciu.'],['a','Jasne definovať problém a cieľ rozhodnutia.'],['e','Vybrať riešenie a uskutočniť ho.'],['c','Navrhnúť uskutočniteľné alternatívy.']],answer:['a','b','c','d','e','f'],why:'Racionálne rozhodovanie smeruje od identifikácie problému cez analýzu a alternatívy k voľbe, realizácii a spätnej kontrole. V realite sa niektoré fázy môžu opakovať.',hints:['Skôr než vyberáš riešenie, musíš vedieť, čo riešiš.','Kontrola účinku patrí po realizácii.']},
{id:'m15',type:'multi',tag:'Výber • vyber 3',title:'Kritériá sú viac než „pocit“',story:'Orbit People vyberá nástroj na onboarding. Niektorí navrhujú rozhodnúť podľa farby loga, iní chcú porovnanie podľa potrieb nováčikov a HR tímu.',prompt:'Vyber PRESNE TRI obhájiteľné kritériá výberu systému.',options:['Ochrana osobných údajov a bezpečnosť.','Farba tlačidla na úvodnej obrazovke je obľúbená u manažéra.','Zrozumiteľnosť používania pre nových zamestnancov.','Počet lajkov na náhodnom príspevku predajcu.','Možnosť napojenia na existujúce HR procesy.','Ktoré riešenie má najvtipnejší názov.'],answers:[0,2,4],why:'Relevantné kritériá majú nadväzovať na cieľ, používateľov, procesy a primerané riziká. Popularita či estetický dojem samy o sebe nerozhodujú.',hints:['Kritérium musí pomáhať splniť účel a obmedziť riziko.','Hľadaj bezpečnosť, použiteľnosť a kompatibilitu s procesmi.']},
{id:'m16',type:'single',tag:'Simulácia • neúplné dáta',title:'Deadline o dve hodiny',story:'V pondelok má nastúpiť skupina nováčikov. Súčasný systém občas zlyhá. IT navrhuje okamžitý prechod na nový neotestovaný softvér. HR môže aktivovať overený záložný manuálny postup pre najdôležitejšie prístupy.',prompt:'Aké rozhodnutie je v tejto chvíli najlepšie zdôvodniteľné?',options:['Okamžite zaviesť neotestovaný systém pre všetkých, bez overenia rizík.','Aktivovať overený záložný postup, určiť priority a nový systém otestovať pred plošným prechodom.','Nič nerobiť, pretože každé rozhodnutie nesie riziko.','Zatajiť problém pred nováčikmi aj vedením.'],answer:1,why:'Pri časovom tlaku treba znižovať nevratné riziko, zabezpečiť kritické funkcie a postupovať s primeraným overovaním alternatív.',hints:['Zváž, čo môžeš bezpečne spustiť hneď a čo si vyžaduje test.','Neotestovaná plošná zmena môže krízu ešte zhoršiť.']},
{id:'m17',type:'match',tag:'Mentálne pasce • chyby',title:'Keď mozog sabotuje rozhodnutie',story:'Manažérsky chat vytvoril galériu výrokov, ktoré znejú presvedčivo, ale skresľujú rozhodovanie. Priraď k nim pasce.',prompt:'Priraď výrok k rozhodovacej chybe.',choices:['Potvrdzovacie skreslenie','Utopené náklady','Skupinové myslenie','Analytická paralýza'],items:[['„Čítam už iba správy, ktoré potvrdzujú môj prvý názor.“','Potvrdzovacie skreslenie'],['„Už sme do toho dali veľa práce, takže to nemôžeme zastaviť ani pri nových dôkazoch.“','Utopené náklady'],['„Radšej nesúhlas nepoviem, nech nenaruším jednotu tímu.“','Skupinové myslenie'],['„Zbierame ďalšie a ďalšie podklady, hoci už máme dosť na primerané rozhodnutie.“','Analytická paralýza']],why:'Tieto pasce znižujú kvalitu rozhodovania. Pomáha otvorene preverovať protidôkazy, vnímať budúce náklady a prínosy a vytvoriť priestor pre nesúhlas.',hints:['Utopené náklady sa už nedajú vziať späť; nemajú samy osebe určovať ďalší postup.','Skupinové myslenie potláča nesúhlas; potvrdzovanie ignoruje protidôkazy.']},
{id:'m18',type:'multi',tag:'Risk review • vyber 3',title:'Rozhodni, ale nezatváraj oči',story:'O probléme s prístupmi vie celé oddelenie. Tím má dve reálne alternatívy. Manažérka chce rozhodnúť do 30 minút, no bez hazardovania so zamestnaneckými údajmi.',prompt:'Vyber PRESNE TRI kroky kvalitného rozhodnutia v tejto situácii.',options:['Porovnať dôsledky oboch možností vrátane dopadu na ľudí a údaje.','Vybrať možnosť, ktorú navrhol najhlasnejší kolega.','Overiť, ktoré informácie sú isté a čo treba ešte zistiť.','Stanoviť, kto rozhodnutie vykoná a ako sa overí výsledok.','Ignorovať možné negatívne dôsledky, keď je málo času.','Odložiť všetko bez časového limitu, aby nikto neniesol zodpovednosť.'],answers:[0,2,3],why:'Rozhodovanie pod tlakom potrebuje kvalitné informácie, porovnanie alternatív a zodpovednosť za realizáciu a kontrolu výsledku.',hints:['Kvalita rozhodnutia nesúvisí s tým, kto kričí najhlasnejšie.','Hľadaj informácie, dôsledky a zodpovednosť za vykonanie.']},
// 04 — PLÁNOVANIE
{id:'m19',type:'single',tag:'SMART • formulovanie cieľa',title:'„Zlepšíme onboarding“ nestačí',story:'Manažérka poslala cieľ na ďalší mesiac: „Treba výrazne zlepšiť adaptáciu nováčikov, ASAP.“ Tím nevie, čo presne znamená úspech.',prompt:'Ktorý cieľ je z ponuky najbližší princípu SMART?',options:['Zaviesť najlepší onboarding v celom vesmíre.','Byť lepší čo najskôr.','Do 30. novembra zabezpečiť, aby aspoň 95 % nováčikov malo prístupy pripravené najneskôr v prvý pracovný deň.','Pracovať viac, pretože treba.'],answer:2,why:'SMART cieľ má byť konkrétny, merateľný, dosiahnuteľný, relevantný a časovo ohraničený. Realistickosť nastaveného percenta treba ešte overiť podľa podmienok firmy.',hints:['Z odpovede musí byť zrejmé čo, koľko a dokedy.','Hľadaj termín a merateľný výsledok; dosiahnuteľnosť sa overuje v praxi.']},
{id:'m20',type:'classify',tag:'Rozlišovanie • cieľ / krok / meranie',title:'Cieľ nie je to isté ako úloha',story:'V pláne sú pomiešané výsledky, činnosti a ukazovatele. Ak si ich tím zamení, odškrtne si aktivity bez toho, aby dosiahol cieľ.',prompt:'Priraď položky k ich funkcii v pláne.',choices:['Cieľ (požadovaný výsledok)','Aktivita / krok (čo urobíme)','Ukazovateľ (čím meriame výsledok)'],items:[['Najneskôr v prvý deň majú všetci nováčikovia funkčné účty.','Cieľ (požadovaný výsledok)'],['Vytvoriť spoločný formulár na žiadosť o prístup.','Aktivita / krok (čo urobíme)'],['Podiel účtov aktivovaných včas.','Ukazovateľ (čím meriame výsledok)'],['Zorganizovať krátke školenie vedúcich tímov.','Aktivita / krok (čo urobíme)'],['Noví zamestnanci vedia, kam smerovať HR otázky.','Cieľ (požadovaný výsledok)'],['Počet nesprávne presmerovaných požiadaviek.','Ukazovateľ (čím meriame výsledok)']],why:'Cieľ opisuje želaný stav; aktivity sú prostriedky a ukazovatele umožňujú vyhodnotiť, či sme výsledok dosiahli.',hints:['Na cieľ sa pýtaš „aký stav má nastať?“, na aktivitu „čo vykonáme?“.','Ukazovateľ často tvorí podiel, počet alebo iná merateľná veličina.']},
{id:'m21',type:'order',tag:'Timeline • závislosti',title:'Harmonogram bez teleportovania',story:'Ráno prídu nováčikovia. Školenie im nemôžeš poslať do účtov, ktoré ešte neexistujú. Postup nastav tak, aby na seba práce nadväzovali.',prompt:'Zoraď kroky podľa logických závislostí.',items:[['c','Vytvoriť a otestovať používateľské účty.'],['e','Overiť, či sa nováčikovia reálne dostanú k materiálom.'],['a','Získať potvrdený zoznam nastupujúcich a potrebné údaje.'],['d','Rozoslať prístupové údaje a inštrukcie bezpečným spôsobom.'],['b','Skontrolovať, či sú podklady úplné, a posunúť ich IT.']],answer:['a','b','c','d','e'],why:'Plán má rešpektovať technologické a organizačné závislosti: vstupy → kontrola → vytvorenie → odovzdanie → overenie výsledku.',hints:['Účty nemôžeš vytvoriť bez identifikácie ľudí.','Posledný krok zisťuje, či adresáti dokážu službu skutočne použiť.']},
{id:'m22',type:'match',tag:'Horizont • typy plánov',title:'Od vízie k dnešnému checklistu',story:'V súbore „FINAL_final_v7“ sú naraz rozhodnutia na tri roky, tento štvrťrok aj dnešné ráno. Kým ich neroztriediš, všetko vyzerá rovnako naliehavo.',prompt:'Priraď opis k PREVAŽUJÚCEMU typu plánu.',choices:['Strategický plán','Taktický plán','Operatívny plán','Záložný / krízový plán'],items:[['Trojnásobne zlepšiť kapacitu náboru v horizonte troch rokov v súlade s rozvojom firmy.','Strategický plán'],['Na najbližšie tri mesiace zaviesť nový postup adaptácie v HR oddelení.','Taktický plán'],['Zajtra o 9:00 vykonať kontrolu všetkých nových prístupov.','Operatívny plán'],['Ak hlavný systém zlyhá, použiť pripravený bezpečný náhradný postup.','Záložný / krízový plán']],why:'Strategické plány určujú dlhodobé smerovanie, taktické rozvíjajú stratégiu v útvaroch, operatívne upravujú dennú realizáciu a záložné riešia odchýlky či riziká.',hints:['Sleduj časový horizont a rozsah plánu.','Plán „ak nastane problém“ je alternatívna reakcia na riziko.']},
{id:'m23',type:'multi',tag:'Plán B • vyber 3',title:'Nie každý „backup“ je backup',story:'IT upozorňuje na možné výpadky. Máš pripraviť záložný plán na prvý deň nováčikov. Nesmie ohroziť ochranu údajov a má byť vykonateľný.',prompt:'Vyber PRESNE TRI prvky rozumného záložného plánu.',options:['Určiť, pri akom výpadku sa plán B aktivuje.','Rozposlať všetkým osobné heslá v otvorenom skupinovom chate.','Pripraviť bezpečný náhradný spôsob vybavenia kritických žiadostí.','Spoliehať sa, že pri probléme niekto spontánne niečo vymyslí.','Určiť osobu zodpovednú za aktiváciu a informovanie tímu.','Odstrániť všetky kontroly bezpečnosti „kvôli rýchlosti“.'],answers:[0,2,4],why:'Kontingenčný plán má jasný spúšťač, vykonateľný postup a zodpovednosť. Krízová situácia nie je dôvod na porušenie bezpečnosti.',hints:['Dobrý záložný plán odpovedá na „kedy“, „ako“ a „kto“.','Záložný postup musí byť zároveň bezpečný.']},
{id:'m24',type:'order',tag:'Plánovací cyklus • kontrola',title:'Plán je živý dokument',story:'Prvý deň onboardingu prešiel, no nie všetky ciele sa naplnili. Tím musí naplánovať ďalší cyklus. Náhodné presúvanie termínov už nestačí.',prompt:'Zostav logický cyklus zlepšovania plánu.',items:[['d','Zmerať výsledky a porovnať ich s cieľmi.'],['b','Vybrať postupy, zdroje, termíny a zodpovednosti.'],['e','Získané poznatky použiť pri ďalšom plánovaní.'],['a','Vyhodnotiť východiskový stav a stanoviť cieľ.'],['c','Realizovať plán a sledovať jeho priebeh.']],answer:['a','b','c','d','e'],why:'Plánovanie nie je jednorazový dokument. Skladá sa z analýzy a cieľov, voľby postupu, realizácie, kontroly a spätnej väzby pre nový cyklus.',hints:['Začni tým, že vieš, kde sa nachádzaš a kam chceš ísť.','Poučenie pre ďalšie plánovanie logicky prichádza až po vyhodnotení.']},
// 05 — KOMUNIKÁCIA
{id:'m25',type:'match',tag:'Kanály • komunikačný mix',title:'Nie všetko patrí do group chatu',story:'Počas onboardingu sa rieši citlivá spätná väzba, oficiálne pravidlá aj jednoduchý status úloh. Jediný komunikačný kanál všetko nevyrieši.',prompt:'Priraď situáciu k NAJVHODNEJŠIEMU kanálu.',choices:['Súkromný rozhovor 1 : 1','Oficiálny e-mail všetkým dotknutým','Projektový nástroj / task board','Krátky operatívny hovor tímu'],items:[['Zamestnanec potrebuje osobne prebrať citlivý konflikt s vedúcim.','Súkromný rozhovor 1 : 1'],['Treba oznámiť schválenú záväznú zmenu postupu s jasným termínom.','Oficiálny e-mail všetkým dotknutým'],['Každý potrebuje vidieť vlastníka úlohy, stav a termín.','Projektový nástroj / task board'],['Pri nečakanom výpadku treba rýchlo koordinovať viacero ľudí.','Krátky operatívny hovor tímu']],why:'Kanál vyberáme podľa citlivosti, potreby spätnej väzby, naliehavosti, dostupnosti záznamu a cieľového publika.',hints:['Citlivý rozhovor nie je vhodné riešiť verejne.','Pri úlohách sa hodí dohľadateľný status; pri urgentnom koordinovaní rýchla interakcia.']},
{id:'m26',type:'single',tag:'Chat simulator • spätná väzba',title:'Poslať túto správu, alebo radšej nie?',story:'Člen tímu dvakrát nedodal podklady načas. V skupinovom chate čaká na odpoveď. Tvoj manažérsky návrh sa práve stane vzorom pre celý tím.',prompt:'Ktorá správa je najkonštruktívnejšia?',options:['„Zase si to pokazil. Ostatní, všimnite si to!“','„Si úplne nezodpovedný človek.“','„Podklady prišli po dohodnutom termíne a posunulo to prípravu. Môžeme si prejsť, čo bolo prekážkou a ako zabezpečíme ďalší termín?“','„Nevadí, termíny sú aj tak len orientačné.“'],answer:2,why:'Užitočná spätná väzba opisuje konkrétne správanie a jeho dopad bez nálepkovania osoby; zároveň otvára cestu k náprave.',hints:['Vyhýbaj sa hodnoteniu osobnosti a verejnému ponižovaniu.','Dobrá správa obsahuje fakt, dopad a návrh ďalšieho kroku.']},
{id:'m27',type:'classify',tag:'Komunikačný radar • šum',title:'Prečo si nerozumieme?',story:'V denníku incidentov sú zachytené typické problémy s komunikáciou. V jednej správe je priveľa skratiek, inde nikto neoveril pochopenie.',prompt:'Priraď hlavný komunikačný jav k situácii.',choices:['Sémantický šum / nejasné formulácie','Nevhodne zvolený kanál','Aktívne počúvanie','Spätná väzba / overenie pochopenia'],items:[['„Sprav KPI report ASAP pre EOD,“ bez vysvetlenia skratiek nováčikovi.','Sémantický šum / nejasné formulácie'],['Citlivú informáciu o zdravotnom stave rozoberajú v otvorenom tímovom chate.','Nevhodne zvolený kanál'],['„Rozumiem správne, že najväčšia prekážka je chýbajúci prístup?“','Aktívne počúvanie'],['„Prosím, potvrď, či máš všetky podklady a vieš, čo je ďalší krok.“','Spätná väzba / overenie pochopenia'],['Pokyny k zásadnej zmene boli ústne povedané jednému človeku bez záznamu pre ostatných.','Nevhodne zvolený kanál']],why:'Sémantický šum vzniká z nejasného jazyka, nevhodný kanál brzdí doručenie alebo bezpečnosť, počúvanie preveruje význam a spätná väzba uzatvára komunikačnú slučku.',hints:['Ujasni si, či je problém v slovách, médiu, počúvaní alebo overení doručenia.','Zopakovať vlastnými slovami = aktívne počúvať.']},
{id:'m28',type:'order',tag:'Konflikt • deeskalácia',title:'Z chatu von, problém vyriešiť',story:'HR a IT sa navzájom obviňujú z výpadku prístupov. Hádka sa šíri do ďalších kanálov. Potrebuješ postup, ktorý zníži napätie a vyústi do dohody.',prompt:'Usporiadaj kroky konštruktívneho riešenia konfliktu.',items:[['d','Dohodnúť konkrétne riešenie, vlastníkov a termín.'],['b','Dať stranám priestor opísať fakty a potreby bez útokov.'],['e','V dohodnutom čase overiť splnenie dohody.'],['a','Zastaviť osobné útoky a nastaviť pravidlá vecného rozhovoru.'],['c','Spoločne pomenovať skutočnú príčinu a možné riešenia.']],answer:['a','b','c','d','e'],why:'Deeskalácia začína bezpečným rámcom, pokračuje počúvaním a diagnostikou problému, dohodou o opatreniach a následnou kontrolou.',hints:['Skôr než hľadáš vinníka či riešenie, vytvor priestor na vecný rozhovor.','Posledný krok preveruje, či dohoda nezostala iba na papieri.']},
{id:'m29',type:'multi',tag:'Editorský audit • vyber 4',title:'Misia: správa, ktorej rozumejú',story:'Vedenie chce rozoslať oznam o krátkom výpadku onboardingového systému. Návrh je: „Systém nejde. Riešte si to. #sorry.“ Potrebuješ z neho vytvoriť funkčnú pracovnú komunikáciu.',prompt:'Vyber PRESNE ŠTYRI prvky, ktoré majú v užitočnom ozname byť.',options:['Čo sa stalo a koho sa to týka.','Špekulácia o vine konkrétneho človeka bez overenia.','Aké kroky majú zamestnanci teraz vykonať.','Kto je kontaktná osoba a kde nájdu pomoc.','Presný čas ďalšej aktualizácie alebo spôsob priebežného informovania.','Verejné zverejnenie interných hesiel.','Veľa ironických narážok namiesto podstatných údajov.'],answers:[0,2,3,4],why:'Krízová správa má byť vecná, jasná, relevantná, akčná a má obsahovať kontakt aj očakávanie ďalších informácií. Nemá ohrozovať súkromie.',hints:['Adresát potrebuje vedieť čo, koho, čo teraz a kde získa novinky.','Jedno z kritérií sa týka pravidelného ďalšieho informovania.']},
{id:'m30',type:'single',tag:'FINAL BOSS • líder tímu',title:'Posledná správa pred spustením',story:'Všetkých päť oddelení je pripravených. Ešte musíš poslať vedeniu a HR tímu posledný status. Nie všetko je dokonalé, ale kritické prístupy fungujú a zvyšné požiadavky majú riešiteľov.',prompt:'Ktorý status je profesionálny, transparentný a zároveň užitočný?',options:['„Máme to. Žiadne otázky.“','„Všetko je strašné a nedá sa nič robiť.“','„Kritické prístupy sú pripravené. Tri otvorené požiadavky rieši IT do 10:00; HR priebežne informuje dotknutých ľudí. Ďalší status pošleme o 10:15.“','„Niektorí ľudia to pokazili. Mená napíšem neskôr.“'],answer:2,why:'Zrozumiteľný status pomenúva overený stav, zostávajúce riziká, zodpovednosť, termín a ďalšiu aktualizáciu. Transparentná komunikácia zvyšuje dôveru a koordináciu.',hints:['Dobrá komunikácia nepredstiera dokonalosť ani nehľadá verejne vinníka.','Hľadaj konkrétny stav, zodpovednosť a termín aktualizácie.']}
];
const app=document.getElementById('app');const ann=document.getElementById('announcer');
let state=readState();let notice='';let toastTimer=null;
function escapeHtml(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function readState(){try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY));if(raw&&typeof raw.name==='string'&&typeof raw.startedAt==='number'&&raw.solved&&typeof raw.solved==='object'){return {name:raw.name,startedAt:raw.startedAt,finishedAt:raw.finishedAt||null,screen:['game','vault','done'].includes(raw.screen)?raw.screen:'game',active:Math.min(TOTAL-1,Math.max(0,Number(raw.active)||0)),solved:raw.solved,drafts:raw.drafts||{}};}}catch(err){}return null;}
function save(){try{if(state)localStorage.setItem(STORAGE_KEY,JSON.stringify(state));else localStorage.removeItem(STORAGE_KEY);}catch(e){}}
function solvedCount(){return state?questions.filter(q=>state.solved[q.id]).length:0;}
function totalScore(){return state?questions.reduce((sum,q)=>sum+Math.max(0,Math.min(100,Number(state.solved[q.id]?.points)||0)),0):0;}
function firstUnsolved(){return questions.findIndex(q=>!state.solved[q.id]);}
function currentIndex(){const first=firstUnsolved();return Math.min(state.active,first<0?TOTAL-1:first);}
function getDraft(q){if(!state.drafts[q.id])state.drafts[q.id]={answer:null,selected:[],map:{},order:q.type==='order'?q.items.map(x=>x[0]):[],attempts:0,hintCount:0};return state.drafts[q.id];}
function formatTime(ms){const sec=Math.max(0,Math.floor(ms/1000)),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h} h ${String(m).padStart(2,'0')} min`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function elapsed(){return (state?.finishedAt||Date.now())-(state?.startedAt||Date.now());}
function topbar(){return `<header class="topbar"><div class="brand"><span class="brand-icon">⌘</span><span>RESET <span style="color:var(--aqua)">/ HR MISSION</span></span></div><div class="top-right"><span class="outline-tag">🎮 SOLO MODE · <b>45 min</b></span>${state?'<button type="button" class="tiny-btn no-print" data-action="reset">↻ Nová hra</button>':''}</div></header>`;}
function footer(){return `<footer class="author-foot">Námet, odborný obsah a autorstvo hry: <strong>Ing. Kristína Kozová, PhD.</strong><div style="margin-top:5px">Vzdelávacia hra z predmetu Manažment · Ľudské zdroje a personálny manažment</div></footer>`;}
function renderLanding(){app.innerHTML=`<div class="wrap">${topbar()}<main class="hero"><span class="eyebrow">● Prístup do centrálneho systému bol zamietnutý</span><h1>FIRMA V <span class="gradient">CHAOSE.</span><br>TY MÁŠ KĽÚČ.</h1><p class="lead">Zajtra nastupujú noví kolegovia. HR systém kolabuje, zodpovednosti sú rozhádzané a tím sa háda v chate. Máš jedinú misiu: získať päť častí kódu a reštartovať firmu.</p><div class="stat-grid"><div class="stat"><strong>30</strong><span>úloh a rozhodnutí</span></div><div class="stat"><strong>5</strong><span>zamknutých modulov</span></div><div class="stat"><strong>45</strong><span>minút · odporúčaný čas</span></div></div><div class="hero-grid"><section class="panel"><span class="smallcaps">📡 Hlasová správa z HR centrály</span><div class="mission-callout">„Vitaj v Orbit People. Náš AI koordinátor NORA stratil prístup k piatim modulom. K odomknutiu nepotrebuješ bifľovať poučky — potrebuješ rozmýšľať ako budúci manažér alebo manažérka.“</div><div class="notice">🎯 V každej úlohe získaš najviac <strong>100 bodov</strong>. Za nesprávne pokusy a použité nápovedy sa body mierne znižujú, ale z hry nevypadneš. Hra pokračuje, až keď úlohu vyriešiš správne.</div><p class="help">🧠 Žiadne výpočty. Čakajú ťa prípady z praxe, triedenie, párovanie, rozhodovanie a skladanie postupov. Po dokončení pošli screenshot výsledkov vyučujúcej.</p></section><section class="panel"><span class="eyebrow">01 / IDENTIFIKÁCIA HR AGENTA</span>${state?`<h2 style="margin:14px 0 7px">Vitaj späť, ${escapeHtml(state.name)}!</h2><p style="color:var(--muted)">V tomto prehliadači máš rozpracovanú misiu. Vyriešené: <strong>${solvedCount()}/${TOTAL}</strong>; body: <strong>${totalScore()}</strong>.</p><button type="button" class="btn btn-primary btn-large" data-action="resume">${state.screen==='done'?'Otvoriť výsledky':'Pokračovať v misii →'}</button><p class="help">Chceš začať od nuly? Použi „Nová hra“ vpravo hore.</p>`:`<form id="start-form"><label class="field-label" for="student-name">Tvoje meno a priezvisko</label><input class="text-field" id="student-name" name="student-name" type="text" autocomplete="name" maxlength="90" placeholder="Napr. Alex Nováková" required><p class="help">Zadaj skutočné meno a priezvisko. Zobrazí sa spolu s tvojimi bodmi na záverečnej obrazovke.</p><div id="name-error" class="help" style="color:var(--red)" aria-live="polite"></div><button class="btn btn-primary btn-large" type="submit">⚡ Spustiť misiu</button></form>`}<p class="help" style="margin-top:19px">🔒 Funguje aj bez prihlásenia a bez servera. Priebežný postup sa ukladá iba v tomto prehliadači.</p></section></div></main>${footer()}</div>`;}
function renderSidebar(active){const completed=solvedCount();const points=totalScore();let next=firstUnsolved();if(next<0)next=TOTAL;return `<aside class="aside"><section class="panel soft"><div class="smallcaps">Tvoj progres · ${escapeHtml(state.name)}</div><div class="scoreline"><strong>Splnené výzvy</strong><strong>${completed} / ${TOTAL}</strong></div><div class="progress-track" role="progressbar" aria-label="Postup v misii" aria-valuenow="${completed}" aria-valuemin="0" aria-valuemax="${TOTAL}"><div class="progress-fill" style="width:${Math.round(completed/TOTAL*100)}%"></div></div><div class="scoreline"><span>⭐ Body</span><strong>${points} / ${MAX_SCORE}</strong></div><div class="scoreline"><span>⏱ Čas v misii</span><strong id="timer">${formatTime(elapsed())}</strong></div><div class="scoreline"><span>🔑 Fragmenty kódu</span><strong>${Math.floor(completed/6)} / 5</strong></div><div class="module-list">${modules.map((m,i)=>{const start=i*6,done=completed>=start+6,accessible=start<=next,activeMod=Math.floor(active/6)===i;return `<button class="module-item ${activeMod?'active':''}" type="button" data-action="module" data-index="${i}" ${!accessible?'disabled':''} ${activeMod?'aria-current="step"':''}><span class="module-symbol">${done?'✓':m.icon}</span><span><span class="module-name">${escapeHtml(m.short)}</span><span class="module-sub">${done?`Kód: ${m.fragment}`:accessible?'Odomknuté':'Zamknuté 🔒'}</span></span></button>`;}).join('')}</div><p class="mobile-scroll-hint">↔ Posuň zoznam modulov do strán.</p></section></aside>`;}
function renderStepNav(modIdx,idx){return `<nav class="mini-step" aria-label="Úlohy v kapitole">${Array.from({length:6},(_,i)=>{const qi=modIdx*6+i,q=questions[qi],ok=!!state.solved[q.id],unlock=firstUnsolved(),allowed=unlock<0||qi<=unlock;return `<button type="button" class="step-dot ${ok?'done':''} ${qi===idx?'current':''}" title="Výzva ${i+1}${ok?' – hotovo':''}" aria-label="Výzva ${i+1}${ok?', splnená':''}" data-action="goto" data-index="${qi}" ${!allowed?'disabled':''}>${ok?'✓':i+1}</button>`;}).join('')}</nav>`;}
function renderBody(q,d){if(q.type==='single'||q.type==='multi'){return `<div class="option-list ${q.type==='multi'?'multi':''}" role="group" aria-label="Možnosti odpovede">${q.options.map((opt,i)=>{const selected=q.type==='single'?d.answer===i:(d.selected||[]).includes(i);return `<button type="button" class="option ${selected?'selected':''}" data-action="pick" data-index="${i}" data-focus="pick-${i}" aria-pressed="${selected}"><span class="choice-icon">${selected?'✓':''}</span><span>${escapeHtml(opt)}</span></button>`;}).join('')}</div>${q.type==='multi'?`<p class="hints-note">Vybrané možnosti: ${(d.selected||[]).length} / ${q.answers.length}. Označenie zmeníš ďalším kliknutím.</p>`:''}`;}
if(q.type==='classify'||q.type==='match'){return `<div class="control-list">${q.items.map((item,i)=>`<div class="control-row"><label for="m-${i}"><strong style="color:var(--aqua)">${String(i+1).padStart(2,'0')}</strong> &nbsp; ${escapeHtml(item[0])}</label><select id="m-${i}" class="picker" data-action="map" data-index="${i}" data-focus="map-${i}"><option value="">— Vyber kategóriu —</option>${q.choices.map((c,ci)=>`<option value="${ci}" ${d.map?.[i]===ci?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div>`).join('')}</div>`;}
if(q.type==='order'){return `<div class="control-list" aria-label="Zoraď kroky pomocou šípok">${d.order.map((id,i)=>{const found=q.items.find(x=>x[0]===id);return `<div class="reorder-row"><span class="order-number">${i+1}</span><span class="reorder-text">${escapeHtml(found[1])}</span><span class="arrs"><button type="button" class="arrow" data-action="move" data-index="${i}" data-direction="-1" data-focus="move-${i}--1" ${i===0?'disabled':''} aria-label="Posunúť krok ${i+1} vyššie">↑</button><button type="button" class="arrow" data-action="move" data-index="${i}" data-direction="1" data-focus="move-${i}-1" ${i===d.order.length-1?'disabled':''} aria-label="Posunúť krok ${i+1} nižšie">↓</button></span></div>`;}).join('')}</div><p class="hints-note">Tip: Úlohy premiestniš šípkami ↑ a ↓. Funguje to aj na mobile.</p>`;}
return '';}
function scoreFor(d){return Math.max(40,100-Math.min(d.attempts||0,3)*12-Math.min(d.hintCount||0,2)*12);}
function renderQuestion(q,idx){const d=getDraft(q),solved=state.solved[q.id],modIdx=Math.floor(idx/6),module=modules[modIdx],inMod=idx%6+1;return `<main id="main" class="game-main"><section class="panel"><div class="chapter-head"><span class="chapter-kicker">${module.icon} MODUL ${modIdx+1}/5 · ${escapeHtml(module.name)}</span><span class="outline-tag">KÓD ${Array.from({length:5},(_,i)=>i<=modIdx?'●':'○').join(' ')}</span></div><h1 class="chapter-title">${escapeHtml(module.subtitle)}</h1><p class="chapter-description">${escapeHtml(module.intro)}</p>${renderStepNav(modIdx,idx)}<div class="question-head"><span class="kind">${escapeHtml(q.tag)} · VÝZVA ${inMod}/6</span><span class="points">${solved?'+'+solved.points:'až '+scoreFor(d)} bodov</span></div><h2 class="question-title" tabindex="-1" id="question-heading">${escapeHtml(q.title)}</h2><div class="story">${escapeHtml(q.story)}</div>${solved?renderSolved(q,idx,solved):`<p class="prompt">${escapeHtml(q.prompt)}</p>${renderBody(q,d)}${d.hintCount?`<div class="hints">💡 ${q.hints.slice(0,d.hintCount).map((s,i)=>`<p style="margin:${i?'9px':'0'} 0 0"><strong>Nápoveda ${i+1}:</strong> ${escapeHtml(s)}</p>`).join('')}</div>`:''}${notice?`<div class="feedback" role="alert">${escapeHtml(notice)}</div>`:''}<div class="tools"><button type="button" class="btn btn-ghost" data-action="hint" ${d.hintCount>=2?'disabled':''}>💡 ${d.hintCount>=2?'Nápovedy vyčerpané':'Nápoveda (−12 bodov)'}</button><button type="button" class="btn btn-primary" data-action="check">Overiť riešenie →</button></div><p class="hints-note">Za chybný pokus −12 bodov (najviac trikrát). Za každú nápovedu −12 bodov. Minimum za správne vyriešenú úlohu: 40 bodov. Čas body neovplyvňuje.</p>`}</section></main>`;}
function renderSolved(q,idx,result){const chapterDone=(idx%6===5),allDone=solvedCount()===TOTAL;return `<section class="success" aria-label="Úloha splnená"><div class="success-mark">✅</div><h3>Prístup potvrdený!</h3><div class="earned">+${result.points} bodov</div><div class="divider"></div><div class="smallcaps">🧠 Čo si z misie odnášaš</div><p>${escapeHtml(q.why)}</p>${chapterDone?`<div class="chapter-earned">🔓 Modul ${Math.floor(idx/6)+1} obnovený. Získavaš fragment kódu <strong style="font-size:1.4rem;color:var(--aqua)">${modules[Math.floor(idx/6)].fragment}</strong>.</div>`:''}<button type="button" class="btn btn-primary btn-large" data-action="next">${allDone?'🚀 Otvoriť finálny trezor':chapterDone?'Odomknúť ďalší modul →':'Ďalšia výzva →'}</button></section>`;}
function renderGame(){let idx=currentIndex();state.active=idx;let html=`<div class="wrap">${topbar()}<div class="game-layout">${renderSidebar(idx)}${renderQuestion(questions[idx],idx)}</div>${footer()}</div>`;app.innerHTML=html;const nav=app.querySelector('.module-list'),activeEl=nav?.querySelector('.module-item.active');if(nav&&activeEl&&window.matchMedia('(max-width:670px)').matches)nav.scrollLeft=Math.max(0,activeEl.offsetLeft-nav.offsetLeft-10);}
function renderVault(){if(solvedCount()!==TOTAL){state.screen='game';renderGame();return;}app.innerHTML=`<div class="wrap">${topbar()}<main class="vault"><section class="panel" style="text-align:center"><span class="eyebrow">● Všetkých 5 modulov obnovených</span><h1 class="chapter-title" style="font-size:clamp(2.3rem,6vw,4.4rem);margin:19px 0">FINÁLNY <span class="gradient">TREZOR</span></h1><p class="lead" style="margin:15px auto">Zvládol/a si všetkých 30 výziev. Teraz zadaj päť písmen získaných z jednotlivých modulov v poradí, v akom si ich odomykal/a.</p><div class="vault-code">${modules.map(m=>`<span class="rune">${m.fragment}</span>`).join('')}</div><p class="vault-label">Zadaj päťmiestny resetovací kód a potvrď záchranu firmy.</p><form id="vault-form" style="max-width:440px;margin:20px auto 0"><label class="field-label" for="vault-input">Finálny prístupový kód</label><input id="vault-input" class="text-field" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="_ _ _ _ _" style="text-align:center;text-transform:uppercase;letter-spacing:.3em;font-weight:900;font-size:1.5rem" required><div id="vault-error" role="alert" class="help" style="color:var(--red)"></div><button class="btn btn-primary btn-large" type="submit">🔓 REŠTARTOVAŤ ORBIT PEOPLE</button></form></section></main>${footer()}</div>`;}
function rankText(score){const pct=score/MAX_SCORE;if(pct>=.93)return '🏆 Manažérsky mastermind';if(pct>=.80)return '🚀 HR crisis solver';if(pct>=.65)return '🧠 Tímový stratég';return '⚡ Odvážny riešiteľ';}
function renderDone(){if(solvedCount()!==TOTAL){state.screen='game';renderGame();return;}const points=totalScore(),pct=Math.round(points/MAX_SCORE*100);app.innerHTML=`<div class="wrap">${topbar()}<main class="final-wrap"><article class="final-card" id="final-card"><header class="final-top"><div class="eyebrow">✅ Misia dokončená · systém reštartovaný</div><h1>ESCAPE ROOM <span class="gradient">SPLNENÁ!</span></h1><div style="color:#c7d7e5">Manažment · Orbit People · RESET / HR MISSION</div></header><section class="nameplate"><div class="smallcaps">Meno a priezvisko študenta / študentky</div><div class="student-name">${escapeHtml(state.name)}</div></section><section class="final-stats" aria-label="Finálne výsledky"><div class="final-stat"><strong>${points} / ${MAX_SCORE}</strong><span>ZÍSKANÉ BODY</span></div><div class="final-stat"><strong>${pct} %</strong><span>ÚSPEŠNOSŤ</span></div><div class="final-stat"><strong>30 / 30</strong><span>VYRIEŠENÉ ÚLOHY</span></div></section><div class="rank">${rankText(points)} · Čas misie: ${formatTime(elapsed())}</div><section class="instruction"><h2>📸 POVINNÝ POSLEDNÝ KROK – ODOVZDANIE VÝSLEDKOV</h2><p><strong>Urob screenshot TEJTO záverečnej obrazovky</strong> tak, aby na snímke bolo jasne viditeľné tvoje <strong>meno a priezvisko, získané body a počet vyriešených úloh.</strong></p><p>Screenshot prilož k e-mailu a odošli vyučujúcej na adresu:</p><span class="email">${EMAIL}</span><p style="margin:12px 0 0">Predmet e-mailu: <strong>Escape room – Manažment – ${escapeHtml(state.name)}</strong></p><p style="margin:8px 0 0;font-size:.85rem">⚠️ Výsledky sa automaticky neodosielajú. E-mail so screenshotom musíš poslať ty.</p></section><div class="completion-date">Dátum dokončenia: ${new Date(state.finishedAt||Date.now()).toLocaleDateString('sk-SK')} · Autor: Ing. Kristína Kozová, PhD.</div></article><div class="result-actions no-print"><button type="button" class="btn btn-primary" data-action="compact">📸 Režim na screenshot</button><button type="button" class="btn btn-secondary" data-action="print">🖨️ Vytlačiť / uložiť ako PDF</button><button type="button" class="btn btn-ghost" data-action="copy-email">📋 Kopírovať e-mail</button></div><p style="color:var(--muted);text-align:center;font-size:.85rem;margin:18px 0 0">Tip: Windows <strong>Win + Shift + S</strong> · Mac <strong>Cmd + Shift + 4</strong> · mobil: kombinácia tlačidiel pre screenshot.</p></main>${footer()}</div>`;}
function render(){notice='';if(!state)return renderLanding();if(state.screen==='vault')return renderVault();if(state.screen==='done')return renderDone();renderGame();}
function isCorrect(q,d){if(q.type==='single')return d.answer===q.answer;if(q.type==='multi')return d.selected.length===q.answers.length&&q.answers.every(x=>d.selected.includes(x));if(q.type==='order')return d.order.join('|')===q.answer.join('|');if(q.type==='classify'||q.type==='match')return q.items.every((it,i)=>q.choices[d.map?.[i]]===it[1]);return false;}
function missing(q,d){if(q.type==='single'&&d.answer===null)return 'Najskôr vyber jednu odpoveď.';if(q.type==='multi'&&d.selected.length!==q.answers.length)return `Vyber presne ${q.answers.length} možnosti. Teraz máš označených ${d.selected.length}.`;if((q.type==='classify'||q.type==='match')&&q.items.some((it,i)=>d.map?.[i]===undefined))return 'Najprv vyber kategóriu v každom riadku.';return '';}
function doCheck(){const q=questions[currentIndex()],d=getDraft(q),miss=missing(q,d);if(miss){notice=miss;return renderGame();}if(isCorrect(q,d)){state.solved[q.id]={points:scoreFor(d),attempts:d.attempts||0,hints:d.hintCount||0};save();renderGame();ann.textContent=`Úloha splnená. Získavaš ${state.solved[q.id].points} bodov.`;document.querySelector('.success h3')?.focus?.();return;}d.attempts=(d.attempts||0)+1;let detail='';if(q.type==='match'||q.type==='classify'){const good=q.items.filter((it,i)=>q.choices[d.map[i]]===it[1]).length;detail=` Správne zaradených: ${good} z ${q.items.length}.`;}else if(q.type==='order'){const good=q.answer.filter((id,i)=>d.order[i]===id).length;detail=` Na správnej pozícii: ${good} z ${q.answer.length}.`;}notice=`Ešte to nie je ono.${detail} Skús prehodnotiť situáciu a oprav odpoveď. Za tento pokus sa pri úspechu odráta 12 bodov.`;save();renderGame();ann.textContent=notice;}
function updatePreserveFocus(cb){const focus=document.activeElement?.dataset?.focus,scrollY=window.scrollY;cb();save();renderGame();window.scrollTo(0,scrollY);if(focus){const els=document.querySelectorAll('[data-focus]');for(const el of els){if(el.dataset.focus===focus&&!el.disabled){el.focus({preventScroll:true});break;}}}}
function jump(index){const first=firstUnsolved();if(index<0||index>=TOTAL||first>=0&&index>first)return;state.active=index;save();renderGame();window.scrollTo({top:0,behavior:'instant'});}
function doReset(){if(!window.confirm('Naozaj chceš začať odznova? Doterajšie body a vyriešené úlohy sa v tomto prehliadači vymažú.'))return;document.body.classList.remove('screenshot-mode');state=null;save();renderLanding();window.scrollTo(0,0);}
function showToast(t){let old=document.getElementById('toast');if(old)old.remove();const toast=document.createElement('div');toast.id='toast';toast.className='toast';toast.textContent=t;document.body.appendChild(toast);if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.remove(),2500);}
app.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action;if(a==='reset')return doReset();if(a==='resume'){render();window.scrollTo(0,0);return;}if(a==='module'){jump(Number(btn.dataset.index)*6);return;}if(a==='goto'){jump(Number(btn.dataset.index));return;}if(a==='pick'){const q=questions[currentIndex()];if(state.solved[q.id])return;const i=Number(btn.dataset.index);updatePreserveFocus(()=>{const d=getDraft(q);if(q.type==='single')d.answer=i;else{const arr=d.selected||[];d.selected=arr.includes(i)?arr.filter(x=>x!==i):[...arr,i];}notice='';});return;}if(a==='move'){const q=questions[currentIndex()];if(state.solved[q.id])return;const i=Number(btn.dataset.index),newI=i+Number(btn.dataset.direction);updatePreserveFocus(()=>{const d=getDraft(q);[d.order[i],d.order[newI]]=[d.order[newI],d.order[i]];notice='';});return;}if(a==='check')return doCheck();if(a==='hint'){const q=questions[currentIndex()],d=getDraft(q);if(d.hintCount<2){d.hintCount++;save();renderGame();}return;}if(a==='next'){if(solvedCount()===TOTAL){state.screen='vault';save();renderVault();}else{state.active=Math.min(TOTAL-1,currentIndex()+1);save();renderGame();}window.scrollTo(0,0);return;}if(a==='compact'){const isCompact=document.body.classList.toggle('screenshot-mode');btn.textContent=isCompact?'↩ Plný režim výsledkov':'📸 Režim na screenshot';window.scrollTo(0,0);return;}if(a==='print'){window.print();return;}if(a==='copy-email'){try{await navigator.clipboard.writeText(EMAIL);showToast('E-mailová adresa skopírovaná.');}catch(err){showToast('E-mail: '+EMAIL);}return;}});
app.addEventListener('change',e=>{if(!e.target.matches('select[data-action="map"]')||!state||state.screen!=='game')return;const q=questions[currentIndex()],i=Number(e.target.dataset.index),value=e.target.value;updatePreserveFocus(()=>{const d=getDraft(q);if(value==='')delete d.map[i];else d.map[i]=Number(value);notice='';});});
app.addEventListener('submit',e=>{if(e.target.id==='start-form'){e.preventDefault();const name=document.getElementById('student-name').value.trim().replace(/\s+/g,' '),bits=name.split(' ');if(bits.length<2||bits.some(bit=>bit.length<2)){document.getElementById('name-error').textContent='Prosím, zadaj meno aj priezvisko (obe aspoň 2 znaky).';return;}state={name,startedAt:Date.now(),finishedAt:null,screen:'game',active:0,solved:{},drafts:{}};save();renderGame();window.scrollTo(0,0);return;}if(e.target.id==='vault-form'){e.preventDefault();const code=document.getElementById('vault-input').value.trim().toUpperCase().replace(/\s+/g,'');if(code!=='RESET'){document.getElementById('vault-error').textContent='Kód nesedí. Poskladaj písmená z modulov zľava doprava.';return;}state.finishedAt=Date.now();state.screen='done';save();renderDone();window.scrollTo(0,0);ann.textContent='Gratulujeme! Misia je dokončená. Odošli screenshot výsledkov e-mailom.';}});
setInterval(()=>{const el=document.getElementById('timer');if(el&&state)el.textContent=formatTime(elapsed());},1000);
render();
</script>
</body>
